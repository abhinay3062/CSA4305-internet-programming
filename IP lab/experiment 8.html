<!DOCTYPE html>
<html>
<head>
    <title>Library Management System</title>
</head>

<body>

<header>
    <h1 align="center">Library Management System</h1>

    <nav align="center">
        <a href="#">Home</a> |
        <a href="#">Books</a> |
        <a href="#">Login</a> |
        <a href="#">Register</a> |
        <a href="#">Contact</a>
    </nav>

    <hr>
</header>

<main>

    <!-- Search Book -->
    <section>
        <h2>Search Book</h2>

        <form>
            <label>Book Name:</label>
            <input type="text" name="bookname">

            <input type="submit" value="Search">
        </form>
    </section>

    <hr>

    <!-- Book Details -->
    <section>
        <h2>Book Details</h2>

        <table border="1" cellpadding="8">
            <tr>
                <th>Book ID</th>
                <th>Book Name</th>
                <th>Author</th>
                <th>Status</th>
            </tr>

            <tr>
                <td>101</td>
                <td>Java Programming</td>
                <td>James Gosling</td>
                <td>Available</td>
            </tr>

            <tr>
                <td>102</td>
                <td>Python Basics</td>
                <td>Guido van Rossum</td>
                <td>Issued</td>
            </tr>
        </table>
    </section>

    <hr>

    <!-- User Login -->
    <section>

        <h2>User Login</h2>

        <form>

            <label>Username:</label><br>
            <input type="text" name="username"><br><br>

            <label>Password:</label><br>
            <input type="password" name="password"><br><br>

            <input type="submit" value="Login">

        </form>

    </section>

    <hr>

    <!-- Contact Form -->

    <section>

        <h2>Contact Us</h2>

        <form>

            <label>Name:</label><br>
            <input type="text"><br><br>

            <label>Email:</label><br>
            <input type="email"><br><br>

            <label>Message:</label><br>
            <textarea rows="5" cols="30"></textarea><br><br>

            <input type="submit" value="Send">

        </form>

    </section>

</main>

<hr>

<footer align="center">
    <p>&copy; 2026 Library Management System</p>
</footer>

</body>
</html>
