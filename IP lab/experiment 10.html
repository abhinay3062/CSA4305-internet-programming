<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bus Booking Dashboard</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#f4f6f9;
}

header{
    background:#0d47a1;
    color:white;
    padding:20px;
    text-align:center;
}

.container{
    width:90%;
    margin:auto;
    margin-top:20px;
}

.card{
    background:white;
    padding:20px;
    margin-bottom:20px;
    border-radius:10px;
    box-shadow:0 2px 8px rgba(0,0,0,.2);
}

h2{
    color:#0d47a1;
    margin-bottom:15px;
}

input,select{
    width:100%;
    padding:10px;
    margin:8px 0;
}

button{
    padding:10px 20px;
    background:#1565c0;
    color:white;
    border:none;
    cursor:pointer;
    border-radius:5px;
}

button:hover{
    background:#0d47a1;
}

.bus-list{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;
}

.bus{
    background:#e3f2fd;
    padding:15px;
    border-radius:10px;
    text-align:center;
}

table{
    width:100%;
    border-collapse:collapse;
}

th,td{
    border:1px solid #ccc;
    padding:10px;
    text-align:center;
}

th{
    background:#1565c0;
    color:white;
}
</style>

</head>
<body>

<header>
<h1>🚌 Online Bus Booking System</h1>
</header>

<div class="container">

<div class="card">
<h2>Available Buses</h2>

<div class="bus-list">

<div class="bus">
<h3>Volvo</h3>
<p>Chennai → Bangalore</p>
<p>₹750</p>
</div>

<div class="bus">
<h3>Sleeper</h3>
<p>Chennai → Madurai</p>
<p>₹600</p>
</div>

<div class="bus">
<h3>AC Coach</h3>
<p>Chennai → Coimbatore</p>
<p>₹850</p>
</div>

</div>
</div>

<div class="card">

<h2>Book Ticket</h2>

<input id="name" placeholder="Passenger Name">

<input id="from" placeholder="From">

<input id="to" placeholder="Destination">

<input type="date" id="date">

<select id="bus">
<option>Volvo</option>
<option>Sleeper</option>
<option>AC Coach</option>
</select>

<input id="seat" type="number" placeholder="Seat Number">

<button onclick="bookTicket()">Book Ticket</button>

</div>

<div class="card">

<h2>Booking History</h2>

<table>

<thead>

<tr>

<th>Name</th>

<th>Route</th>

<th>Date</th>

<th>Bus</th>

<th>Seat</th>

</tr>

</thead>

<tbody id="history"></tbody>

</table>

</div>

</div>

<script>

let bookings=[];

function bookTicket(){

let booking={

name:name.value,

route:from.value+" → "+to.value,

date:date.value,

bus:bus.value,

seat:seat.value

};

bookings.push(booking);

display();

alert("Ticket Booked Successfully!");

}

function display(){

history.innerHTML="";

bookings.forEach(b=>{

history.innerHTML+=`

<tr>

<td>${b.name}</td>

<td>${b.route}</td>

<td>${b.date}</td>

<td>${b.bus}</td>

<td>${b.seat}</td>

</tr>

`;

});

}

</script>

</body>
</html>
